name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: npx tsc --noEmit
      - run: bun run lint
      - run: bun run build
