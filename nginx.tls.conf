# 生产 HTTPS/TLS 参考配置（替代 frontend/nginx.conf）
#
# 用法：把证书挂载进 nginx 容器后，用本文件覆盖 /etc/nginx/conf.d/default.conf。
#   docker-compose 中 nginx 服务加：
#     volumes:
#       - ./nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
#       - /etc/letsencrypt/live/<domain>:/etc/nginx/certs:ro
# 证书路径按需改：
#   - Let's Encrypt(certbot)：/etc/letsencrypt/live/<domain>/fullchain.pem + privkey.pem
#   - 阿里云/自有证书：/path/to/fullchain.pem + /path/to/privkey.pem

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 生产建议开 HSTS（证书稳定后再启用）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # SSE / 长轮询：关闭缓冲，前端 chat 流式依赖
    location /api/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }
}
